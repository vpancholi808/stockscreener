name: pages

# Publishes the static site to GitHub Pages.
#
# Two pages, with different data requirements:
#
#   index.html     the screener, a rendering of 497 real S&P 500 companies.
#                  Needs a loaded database, so it is built by the
#                  sp500-real-data workflow and committed; this workflow
#                  publishes whatever was last committed rather than
#                  rebuilding it, so a deploy never waits on SEC.
#   frontier.html  the efficient frontier and the CAL. Needs no data at all —
#                  the inputs are assumptions the reader sets and the
#                  arithmetic runs in their browser — so it is built here on
#                  every deploy from stdlib alone.
#
# Only filings-derived data reaches this site. SEC filings are US government
# work and public domain; scraped price data generally is not redistributable,
# which is why SERVE_MARKET_DATA is never set here and the committed
# index.html is built with it off.

on:
  push:
    branches: [main]
    paths:
      - "build_frontier_page.py"
      - "build_site.py"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# racing it to the same URL.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the frontier page
        run: |
          # stdlib only — no pip install, so a deploy cannot break on a
          # dependency resolving differently than it did last week.
          python build_frontier_page.py --out site/frontier.html

      - name: Check what we are about to publish
        run: |
          test -s site/frontier.html || { echo "::error::frontier.html missing"; exit 1; }
          if [ ! -s site/index.html ]; then
            echo "::warning::site/index.html is missing — publishing the \
          frontier page alone. Run the 'sp500 real data' workflow to build \
          the screener."
            cp site/frontier.html site/index.html
          fi
          cp site/index.html site/404.html
          ls -la site/
          echo "### Publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in site/*.html; do
            echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done

      # enablement:true asks the API to create the Pages site. The Actions
      # GITHUB_TOKEN cannot do that — creating a Pages site needs repo-admin
      # rights, and the token has none however `permissions:` is set, so it
      # comes back "Resource not accessible by integration". It is left on
      # because it succeeds when the workflow is run with a PAT, and tolerated
      # because the next step gives a far better message than its stack trace.
      - uses: actions/configure-pages@v5
        id: configure
        continue-on-error: true
        with:
          enablement: true

      - name: Confirm Pages is turned on
        if: steps.configure.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages is enabled; configure-pages failed for another reason."
            exit 1
          fi
          echo "::error::GitHub Pages is not enabled for this repository, and \
          a workflow cannot turn it on itself. A repository admin needs to \
          open Settings -> Pages and set Source to 'GitHub Actions' (one \
          dropdown, no branch to pick). Re-run this workflow afterwards and \
          it will publish. The pages are built and committed either way."
          {
            echo "## Not published yet"
            echo ""
            echo "GitHub Pages is switched off for this repository, and a"
            echo "workflow cannot switch it on — that needs repository admin"
            echo "rights the Actions token does not have."
            echo ""
            echo "**Settings → Pages → Source: GitHub Actions**, then re-run"
            echo "this workflow. Nothing else needs changing."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Where it went
        run: |
          echo "::notice::Published to ${{ steps.deployment.outputs.page_url }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Live at ${{ steps.deployment.outputs.page_url }}**" \
            >> "$GITHUB_STEP_SUMMARY"
