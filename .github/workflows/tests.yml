name: tests

# The suites are known-answer checks on synthetic data and need no network,
# so CI can verify every model on each push without touching SEC or Yahoo.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the superset (core + web + streamlit), so this
          # installs exactly what a deployment gets. Installing the narrower
          # sets here would let an undeclared dependency pass CI.
          pip install -r requirements.txt
          pip install httpx

      - name: Install a browser for the static-page cross-check
        run: |
          # test_frontier_page.py loads site/frontier.html in headless
          # Chromium and asserts its JavaScript agrees with
          # finmodel/quant/portfolio.py. That suite SKIPS when Playwright is
          # absent, so without this step the check would quietly stop running
          # while CI stayed green — which is the failure mode it exists to
          # prevent. Chromium only; the other browsers are not used.
          pip install playwright
          playwright install --with-deps chromium

      - name: Run all suites
        run: |
          set -e
          for t in test_pipeline test_capm test_dcf test_quant test_stoch \
                   test_foundation test_screener test_web test_valuation \
                   test_streamlit test_yahoo test_returns test_performance \
                   test_edgar test_profiles test_concepts test_frontier \
                   test_frontier_page; do
            echo "::group::$t"
            python -W ignore $t.py
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check and build
        working-directory: web
        # API_BASE is unreachable during the build; pages that fetch are
        # dynamic (ƒ) and are not prerendered, so the build still validates
        # types and compilation.
        env:
          API_BASE: http://127.0.0.1:8000
        run: npm run build
