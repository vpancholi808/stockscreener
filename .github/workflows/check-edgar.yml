name: check EDGAR access

# Proves this repository can pull live SEC data, using only EDGAR_USER_AGENT.
#
# The refresh workflow needs a database as well, so it cannot tell you whether
# EDGAR itself is reachable — it stops before trying. This one isolates that
# single question: is the User-Agent secret set, and does SEC answer it?
#
# Manual only. It makes a handful of requests and finishes in well under a
# minute, so there is nothing to schedule.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to fetch"
        required: false
        default: "MU AAPL"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Confirm the secret is set
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          if [ -z "$EDGAR_USER_AGENT" ]; then
            echo "::error::EDGAR_USER_AGENT is not set. Add it under"\
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Print only the domain. The secret holds a real email address and
          # logs of a public repository are readable by anyone.
          echo "Secret is set (contact domain: ${EDGAR_USER_AGENT##*@})"

      - name: Pull live SEC data
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python check_edgar.py ${{ github.event.inputs.tickers || 'MU AAPL' }}

      - name: Build a real model end to end
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from finmodel import ThreeStatementModel
          from finmodel.scorecard import compute_scorecard

          print("## EDGAR access confirmed\n")
          print("| Ticker | Company | FY | Revenue | Health |")
          print("|---|---|---|---|---|")
          for ticker in ("MU", "AAPL"):
              try:
                  model = ThreeStatementModel.from_ticker(ticker, n_years=5)
                  fin = model.financials
                  year = fin.latest_year()
                  revenue = fin.income_statement.at["revenue", year]
                  card = compute_scorecard(fin)
                  print("| %s | %s | FY%s | $%.2fB | %d/%d |" % (
                      ticker, fin.entity_name[:28], year, revenue / 1e9,
                      card["passed"], card["total"]))
              except Exception as exc:
                  print("| %s | failed: %s | | | |" % (ticker, str(exc)[:60]))
          PY
