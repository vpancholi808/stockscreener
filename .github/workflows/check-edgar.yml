name: check EDGAR access

# Proves this repository can pull live SEC data, using only EDGAR_USER_AGENT.
#
# The refresh workflow needs a database as well, so it cannot tell you whether
# EDGAR itself is reachable — it stops before trying. This one isolates that
# single question: is the User-Agent secret set, and does SEC answer it?
#
# Manual only. It makes a handful of requests and finishes in well under a
# minute, so there is nothing to schedule.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to fetch"
        required: false
        default: "MU AAPL"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Confirm the secret is set
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          if [ -z "$EDGAR_USER_AGENT" ]; then
            echo "::error::EDGAR_USER_AGENT is not set. Add it under"\
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Print only the domain. The secret holds a real email address and
          # logs of a public repository are readable by anyone.
          echo "Secret is set (contact domain: ${EDGAR_USER_AGENT##*@})"

      - name: Probe each layer separately
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          # Results are emitted as ::notice:: / ::error:: workflow commands so
          # they land in the run's annotations, which are readable through the
          # API. Printing to stdout alone puts them only in the log archive.
          # Nothing here echoes the secret: only status codes and exception
          # text, never the User-Agent value.
          python - <<'PY'
          import os, sys, traceback
          ua = os.environ["EDGAR_USER_AGENT"]
          failed = []

          def note(name, detail):
              print("::notice::PROBE %s | %s" % (name, detail))

          def fail(name, detail):
              failed.append(name)
              print("::error::PROBE %s FAILED | %s" % (name, str(detail)[:400]))

          # 1. Can this runner reach SEC at all, with a proper User-Agent?
          try:
              import requests
              raw_was_dirty = (ua != " ".join(ua.split()))
              note("0-secret-hygiene", "raw secret needed whitespace repair: %s"
                   % raw_was_dirty)
              r = requests.get("https://www.sec.gov/files/company_tickers.json",
                               headers={"User-Agent": " ".join(ua.split())},
                               timeout=30)
              note("1-raw-https", "HTTP %d, %d bytes, server=%s"
                   % (r.status_code, len(r.content),
                      r.headers.get("server", "?")))
              if r.status_code != 200:
                  fail("1-raw-https", "body starts: %r" % r.text[:200])
          except Exception as exc:
              fail("1-raw-https", "%s: %s" % (type(exc).__name__, exc))

          # 2. The project's client, same endpoint.
          try:
              from finmodel.data.edgar import EdgarClient
              client = EdgarClient(user_agent=ua)
              cik = client.ticker_to_cik("MU")
              note("2-ticker-map", "MU -> CIK %010d" % cik)
          except Exception as exc:
              fail("2-ticker-map", "%s: %s" % (type(exc).__name__, exc))

          # 3. data.sec.gov is a different host and can be blocked separately.
          try:
              facts = client.company_facts("MU")
              note("3-companyfacts", "%s, %d us-gaap concepts"
                   % (facts.get("entityName", "?"),
                      len(facts.get("facts", {}).get("us-gaap", {}))))
          except Exception as exc:
              fail("3-companyfacts", "%s: %s" % (type(exc).__name__, exc))

          # 4. The full path a real run takes.
          try:
              from finmodel import ThreeStatementModel
              model = ThreeStatementModel.from_ticker("MU", n_years=5)
              fin = model.financials
              year = fin.latest_year()
              note("4-model", "%s FY%s revenue $%.2fB"
                   % (fin.entity_name[:30], year,
                      fin.income_statement.at["revenue", year] / 1e9))
          except Exception as exc:
              fail("4-model", "%s: %s" % (type(exc).__name__, exc))
              traceback.print_exc()

          # 5. The revenue series itself. A single odd year points at a tag
          #    change or a restatement; every year wrong points at parsing.
          try:
              fin = model.financials
              row = fin.income_statement.loc["revenue"]
              note("5-revenue-series", " | ".join(
                  "FY%s $%.2fB" % (y, row[y] / 1e9) for y in fin.years))
              ni = fin.income_statement.loc["net_income"]
              note("5-net-income", " | ".join(
                  "FY%s $%.2fB" % (y, ni[y] / 1e9) for y in fin.years))
              import json as _json
              facts = client.company_facts("MU")["facts"]["us-gaap"]
              for tag in ("RevenueFromContractWithCustomerExcludingAssessedTax",
                          "Revenues", "SalesRevenueNet"):
                  if tag in facts:
                      rows = [f for f in facts[tag]["units"]["USD"]
                              if f.get("form") == "10-K" and f.get("fp") == "FY"]
                      recent = sorted(rows, key=lambda f: f["end"])[-3:]
                      note("5-tag-%s" % tag[:28], " | ".join(
                          "%s..%s fy%s $%.2fB" % (f.get("start", "?")[:10],
                                                  f["end"][:10], f.get("fy"),
                                                  f["val"] / 1e9)
                          for f in recent))
          except Exception as exc:
              fail("5-revenue-series", "%s: %s" % (type(exc).__name__, exc))

          print("::notice::SUMMARY failed=%s" % (",".join(failed) or "none"))
          sys.exit(1 if failed else 0)
          PY

      - name: Build a real model end to end
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from finmodel import ThreeStatementModel
          from finmodel.scorecard import compute_scorecard

          print("## EDGAR access confirmed\n")
          print("| Ticker | Company | FY | Revenue | Health |")
          print("|---|---|---|---|---|")
          for ticker in ("MU", "AAPL"):
              try:
                  model = ThreeStatementModel.from_ticker(ticker, n_years=5)
                  fin = model.financials
                  year = fin.latest_year()
                  revenue = fin.income_statement.at["revenue", year]
                  card = compute_scorecard(fin)
                  print("| %s | %s | FY%s | $%.2fB | %d/%d |" % (
                      ticker, fin.entity_name[:28], year, revenue / 1e9,
                      card["passed"], card["total"]))
              except Exception as exc:
                  print("| %s | failed: %s | | | |" % (ticker, str(exc)[:60]))
          PY
