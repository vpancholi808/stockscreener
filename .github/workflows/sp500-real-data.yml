name: sp500 real data

# Loads the real S&P 500 — SEC filings plus Yahoo prices and profiles — into
# a throwaway SQLite database, then checks the result.
#
# This is the only place the full pipeline runs against live data. The
# development sandbox can reach neither SEC nor Yahoo, and the offline suites
# only prove the models are arithmetically right on synthetic input. They
# cannot show whether coverage is thin on some line item, whether a sector
# median is implausible, or whether the pages still render when the data is
# messy rather than generated.
#
# No DATABASE_URL needed: SQLite in the runner's workspace is enough to
# validate, and the database is discarded with the runner.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Constituents to load (0 = all ~503)"
        required: false
        default: "60"
      skip_profiles:
        description: "Skip the Yahoo profile pass (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write      # commit the generated site back to the repo
  pages: write         # publish it
  id-token: write      # required by actions/deploy-pages

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load the universe
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          DATABASE_URL: sqlite:///sp500.db
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          SKIP: ${{ github.event.inputs.skip_profiles || 'no' }}
        run: |
          if [ -z "$EDGAR_USER_AGENT" ]; then
            echo "::error::EDGAR_USER_AGENT is not set."
            exit 1
          fi
          ARGS="--sp500"
          [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$SKIP" = "yes" ] && ARGS="$ARGS --no-profiles"
          echo "Running: python worker.py $ARGS"
          time python worker.py $ARGS 2>&1 | tail -40

      - name: Validate
        if: always()
        env:
          DATABASE_URL: sqlite:///sp500.db
          SERVE_MARKET_DATA: "true"
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          SKIP: ${{ github.event.inputs.skip_profiles || 'no' }}
        run: |
          # Expect most of what was asked for. Some constituents legitimately
          # have no usable 10-K XBRL (recent listings, foreign filers), so the
          # floor is a fraction rather than the exact count.
          if [ "$LIMIT" = "0" ]; then
            export EXPECT_MIN_COMPANIES=420
          else
            export EXPECT_MIN_COMPANIES=$(( LIMIT * 70 / 100 ))
          fi
          if [ "$SKIP" = "yes" ]; then
            export EXPECT_MIN_FORWARD_PE=0
          else
            export EXPECT_MIN_FORWARD_PE=$(( EXPECT_MIN_COMPANIES / 2 ))
          fi
          echo "Floors: companies>=$EXPECT_MIN_COMPANIES forward_pe>=$EXPECT_MIN_FORWARD_PE"
          python validate_real_data.py

      - name: Write the summary
        if: always()
        env:
          DATABASE_URL: sqlite:///sp500.db
          SERVE_MARKET_DATA: "true"
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          from finmodel.web.store import Database

          db = Database()
          try:
              s = db.stats()
          except Exception as exc:
              print("Could not read the database: %s" % exc)
              raise SystemExit(0)

          print("## S&P 500 real-data run\n")
          print("| | |")
          print("|---|---|")
          print("| Companies | **%s** |" % s["companies"])
          print("| Passing the default screen | **%s** |" % (s["passing"] or 0))
          print("| Sectors | **%s** |" % s["sectors"])
          print("| Latest fiscal year | **%s** |" % s["latest_year"])
          print("| With market data | **%s** |" % s["priced"])

          conn = db.connect()
          df = pd.read_sql_query(
              "SELECT c.ticker, c.name, c.sector, c.fiscal_year, c.revenue,"
              " c.operating_margin, c.roic, c.health_passed, c.health_total,"
              " c.piotroski, m.pe, m.forward_pe, m.dividend_yield,"
              " m.target_mean_price, m.price"
              " FROM companies c LEFT JOIN market_data m ON c.cik = m.cik"
              " ORDER BY c.revenue DESC LIMIT 20", conn)
          print("\n### Largest 20 by revenue\n")
          print("| Ticker | Sector | FY | Revenue | Op margin | ROIC | Health |"
                " P/E | Fwd P/E | Yield |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          def f(v, fmt, scale=1.0):
              return "—" if v is None or v != v else fmt % (v * scale)
          for _, r in df.iterrows():
              print("| %s | %s | %s | %s | %s | %s | %s/%s | %s | %s | %s |" % (
                  r.ticker, (r.sector or "")[:18], r.fiscal_year,
                  f(r.revenue, "$%.1fB", 1e-9),
                  f(r.operating_margin, "%.1f%%", 100),
                  f(r.roic, "%.1f%%", 100),
                  int(r.health_passed) if r.health_passed == r.health_passed else "?",
                  int(r.health_total) if r.health_total == r.health_total else "?",
                  f(r.pe, "%.1f"), f(r.forward_pe, "%.1f"),
                  f(r.dividend_yield, "%.2f%%", 100)))

          sectors = pd.read_sql_query(
              "SELECT sector, COUNT(*) n,"
              " SUM(CASE WHEN passes_screen THEN 1 ELSE 0 END) passing,"
              " AVG(operating_margin) om, AVG(roic) roic"
              " FROM companies GROUP BY sector ORDER BY n DESC", conn)
          print("\n### By sector\n")
          print("| Sector | Companies | Passing | Avg op margin | Avg ROIC |")
          print("|---|---|---|---|---|")
          for _, r in sectors.iterrows():
              print("| %s | %d | %d | %s | %s |" % (
                  r.sector, r.n, r.passing or 0,
                  f(r.om, "%.1f%%", 100), f(r.roic, "%.1f%%", 100)))
          PY

      - name: Build the static site
        env:
          DATABASE_URL: sqlite:///sp500.db
          # Deliberately NOT set: a public page carries only SEC data, which
          # is US government work and in the public domain. Scraped price
          # data generally is not redistributable.
        run: |
          python build_site.py --out site/index.html \
            --title "S&P 500 Equity Health Screener"
          cp site/index.html site/404.html
          ls -la site/

      - name: Export the publishable dataset
        run: |
          # Strips market_data and price-derived benchmarks. The committed
          # copy is filings-only, because a public repository is
          # redistribution and scraped price data is not ours to redistribute.
          python export_dataset.py --src sp500.db --out data/sp500.db

      - name: Commit the site and dataset to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/index.html data/sp500.db
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Rebuild site and dataset from real S&P 500 data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        id: configure
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: pages
        continue-on-error: true

      - name: Where the site went
        if: always()
        run: |
          echo "### Site" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.pages.outputs.page_url }}" ]; then
            echo "Published: ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages is not enabled for this repository yet." >> "$GITHUB_STEP_SUMMARY"
            echo "Settings -> Pages -> Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "The page is committed at site/index.html regardless." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp500-database
          path: sp500.db
          retention-days: 7
          if-no-files-found: warn
