# Theme and server defaults for the Streamlit app.
#
# Secrets do NOT go here — this file is committed. Put EDGAR_USER_AGENT and
# DATABASE_URL in .streamlit/secrets.toml locally (gitignored) or in the
# "Secrets" box of your Streamlit Cloud app settings.

[theme]
base = "light"
primaryColor = "#1f4e5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f7"
textColor = "#15232b"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# Show errors in the browser rather than only in the server log — on a hosted
# deployment the log is the one thing you cannot see from the page.
#
# This leaks tracebacks and file paths to anyone who visits. That is an
# acceptable trade here because the repository is public, so the code those
# traces point at is already readable. Set this to false if the repo ever goes
# private, or once the deployment is stable enough not to need it.
showErrorDetails = true
